<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karla Godoy | Nutrición, Bienestar & Beauty</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#4f0911',
            'secondary': '#713132',
            'accent': '#916066',
            'earth': '#856654',
            'nude': '#d0bdac',
            'cream': '#FAF9F6',
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts - Fuentes de Lujo de Karla Godoy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Transiciones suaves de opacidad */
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* Estilos personalizados para los select e inputs del sistema */
    select, input, textarea {
      background-color: #ffffff !important;
      transition: all 0.2s ease-in-out;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #916066 !important;
      box-shadow: 0 0 0 3px rgba(145, 96, 102, 0.15) !important;
    }
  </style>
</head>
<body class="bg-[#FDFBF7] text-[#2C2421] antialiased selection:bg-[#916066]/20 selection:text-[#4f0911]">
  
  <!-- Contenedor general donde se inyectará dinámicamente toda la app de Karla Godoy -->
  <div id="app-root" class="min-h-screen flex flex-col justify-between"></div>

  <!-- Scripts que cargan los datos y la lógica stática para Local / GitHub Pages sin CORS -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
